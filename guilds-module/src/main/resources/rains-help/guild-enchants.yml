id: guild-enchants
title: Guild enchantments and attendants
summary: Unlock Rain's enchantments for the whole guild from its bank, and place a banker, vault keeper or enchanter.
intro: |
  Some enchantments are only unlocked by guilds, paid from the guild bank.
icon: ENCHANTED_BOOK
category: Guilds & teams
order: 9
module: guilds
aliases: [enchants, enchanter, banker, keeper, attendants, npc]
keywords: [unlock, price, bank, books, enchantment, shop, vault keeper, banker, place, npc]
related: [guilds, guild-bank, guild-perks]
sections:
  - question: How do guild enchantments work?
    title: Unlocking
    text: |
      Rain's special enchantments are not sold to individuals. A guild unlocks one by paying {setting:guilds:enchants.unlock-price|money} from its bank (some cost more); from then on every member can buy its books at the shop.
  - question: How do I unlock one?
    title: Paying for it
    text: |
      Open {run:/guild enchants} to see every enchantment, what it costs and what the bank holds; click a locked one and confirm. Only ranks allowed to <i>pay from the bank</i> may, since it is the guild's money. If the bank does not hold the price, or the guild's records cannot be written, nothing is taken.
  - question: What are the guild's attendants?
    title: Attendants
    text: |
      Three NPCs: the <b>guild banker</b> (opens the bank), the <b>vault keeper</b> (the vault) and the <b>guild enchanter</b> (the enchantments). Members right-click them, only members of their own guild may use them, and the screen opens straight away.
  - question: How do I place one?
    title: Placing attendants
    text: |
      Stand where you may build and type {cmd:/guild npc bank}, {cmd:/guild npc vault} or {cmd:/guild npc enchants}. A guild has one of each; {cmd:/guild npc remove bank} (or vault, enchants) takes one away, so you can place it again elsewhere. Only the leader and ranks with the <i>place attendants</i> permission (officers have it, unless the leader takes it away) may. Wait a moment after a restart: they are read first.
