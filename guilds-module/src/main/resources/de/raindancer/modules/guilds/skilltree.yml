# The guild skill tree, read by Core's SkillTree. Five branches, each filling five columns by three rows (at: [column,
# row]); a node needs ONE of what it `requires` (a neighbour in its branch, joined by a line) and is shut while one of
# what it `excludes` is taken. `effects` are per rank (Perk.java says what each means), `cost` is perk points per rank.
# `level` is the guild level the first rank needs and `level-step` how many more each further rank needs; a level past
# the server's top level counts as the top level.
#
# vault, haste, luck, scholar, prosperous, recruiter, diplomat and pathfinder are the perks guilds bought before the
# tree: same ids, ranks, costs and levels, so what a guild bought is where it was.
branches:
  hall:
    title: The Hall
    icon: bell
    blurb: Room for more members and allies, the vault, the week's contracts.
  craft:
    title: The Workshop
    icon: golden_pickaxe
    blurb: Hands that dig, grow and trade, and the experience it earns.
  lore:
    title: The Library
    icon: enchanted_book
    blurb: More experience for members and guild; levels kept through death.
  road:
    title: The Road
    icon: compass
    blurb: Swift feet, a quick way home, the sea and fire.
  banner:
    title: The Banner
    icon: red_banner
    blurb: Strength in numbers, near guildmates; rivals, raids and bosses.

