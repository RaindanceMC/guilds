id: guild-perks
title: The skill tree, prestige and the vault
summary: Spend perk points in a skill tree of five branches; start over at the top for a star and a lasting bonus.
intro: |
  Levels are bragging rights. Perks are levels that do something.
icon: NETHER_STAR
category: Guilds & teams
order: 5
module: guilds
aliases: [perks-guild, skilltree, skill-tree, guild-tree, prestige, vault, guildvault, points, respec, crown-perk]
keywords: [skill tree, branch, node, capstone, choice, haste, luck, scholar, prosperous, recruiter, diplomat, pathfinder, rally, contracts, points, star, crown, vault, storage]
related: [guild-levels, guilds, guild-enchants]
sections:
  - question: What are perk points?
    title: Perk points
    text: |
      A guild earns one point for every level it gains (a prestige keeps them), {setting:guilds-progress:honours.points-per-prestige} for every prestige and {setting:guilds-progress:honours.points-per-crown} for every weekly crown. Spend them in the skill tree on {run:/guild perks}: a rank of a node costs its points (most cost one, choices two, capstones three) and needs the guild to be at that rank's level <i>right now</i>. You need the <i>spend perk points</i> permission.
  - question: How does the skill tree work?
    title: The skill tree
    text: |
      Five branches, a page each — turn them with the arrows: <b>The Hall</b> (members, allies, the vault, more and richer contracts), <b>The Workshop</b> (haste, luck, Hero of the Village, experience from mining, farming, breeding and trade), <b>The Library</b> (more experience for members and guild, levels kept through death), <b>The Road</b> (speed, jumps, water breathing, softer falls, a faster guild home, fire resistance) and <b>The Banner</b> (bonuses with a guildmate near: regeneration, strength or resistance; experience from monsters, bosses, raids and rivals).
      Every branch starts at its left node. A node needs one next to it taken first; a line lights up once both its ends are taken. Each branch has one <b>choice</b>: taking one side shuts the other. Its last node, the <b>capstone</b>, needs level {setting:guilds:levels.top}. Hover a node to see what it does, what it costs and the level its next rank needs.
      The eight perks of before the tree are nodes of the same name, so what a guild had bought it still has.
  - question: Can I take my points back?
    title: Respec
    text: |
      Yes: <b>Take the points back</b> on the perks page, or shift-click the middle button of a tree page (both ask first), unlearns every node and returns every point.{if:guilds-progress:honours.respec-days > 0} You can do it once every {setting:guilds-progress:honours.respec-days|days}.{/if} The whole guild loses the nodes until the points are spent again.
  - question: What is prestige?
    title: Prestige
    text: |
      A guild at the top level (level {setting:guilds:levels.top}) can start again: the leader types {cmd:/guild prestige} (which explains it) and then {cmd:/guild prestige confirm}, or uses the perks page. The guild goes back to level 1, keeps every node and point, gets {setting:guilds-progress:honours.points-per-prestige} perk points, a star after its tag and a lasting +{setting:guilds-progress:honours.percent-per-prestige|percent} guild experience per star. Members and allies stay, but the room a level gave goes until it is earned back. Everybody is told.
  - question: What is the guild vault?
    title: The vault
    text: |
      A chest every member shares: the <b>Guild Vault</b> node of The Hall. Open it with {run:/guild vault}, with the vault keeper (see {topic:guild-enchants}) or on the perks page. Anybody may put things in (shift-click from your inventory, or drop onto a page); taking things out needs the <i>take from the vault</i> permission. Armour goes onto its stand first.
      More rows come with further ranks of the node. A guild with items in its vault cannot disband until it is emptied. A full vault sends back what did not fit.
  - question: What does the crown do?
    title: The crown
    text: |
      The guild with the most experience last week wears ♛ this week next to its members' names, and gets perk points. See {topic:guild-levels} for the race.
